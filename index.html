<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brian File Storage</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f6fb;
    color: #1f2937;
}

/* ==============================
   HEADER
============================== */

.header {
    background: linear-gradient(135deg, #1d4ed8, #3b82f6);
    color: white;
    padding: 28px 20px;
}

.header-inner {
    max-width: 1100px;
    margin: auto;
}

.header h1 {
    margin: 0;
    font-size: 28px;
}

.header p {
    margin: 7px 0 0;
    font-size: 14px;
    opacity: 0.9;
}

/* ==============================
   MAIN
============================== */

.container {
    max-width: 1100px;
    margin: 25px auto;
    padding: 0 15px;
}

/* ==============================
   TOOLBAR
============================== */

.toolbar {
    display: flex;
    gap: 10px;
    background: white;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    margin-bottom: 15px;
}

.search {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
}

.search:focus {
    border-color: #2563eb;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
}

.upload-button {
    background: #16a34a;
    color: white;
}

.upload-button:hover {
    background: #15803d;
}

.refresh-button {
    background: #2563eb;
    color: white;
}

.refresh-button:hover {
    background: #1d4ed8;
}

/* ==============================
   NOTICE
============================== */

.notice {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    color: #1e40af;
    padding: 12px 15px;
    border-radius: 9px;
    margin-bottom: 15px;
    font-size: 13px;
}

/* ==============================
   BREADCRUMB
============================== */

.breadcrumb {
    background: white;
    border: 1px solid #e5e7eb;
    padding: 14px 17px;
    border-radius: 10px;
    margin-bottom: 15px;
    font-size: 14px;
}

.crumb {
    color: #2563eb;
    cursor: pointer;
    font-weight: bold;
}

.crumb:hover {
    text-decoration: underline;
}

.separator {
    color: #9ca3af;
    margin: 0 6px;
}

/* ==============================
   STORAGE
============================== */

.storage {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

/* ==============================
   TABLE HEADER
============================== */

.table-header {
    display: grid;
    grid-template-columns: 1fr 130px 160px;
    background: #f8fafc;
    padding: 13px 18px;
    color: #6b7280;
    font-size: 12px;
    font-weight: bold;
}

/* ==============================
   FILE ROW
============================== */

.file-row {
    display: grid;
    grid-template-columns: 1fr 130px 160px;
    min-height: 68px;
    align-items: center;
    padding: 12px 18px;
    border-top: 1px solid #e5e7eb;
}

.file-row:hover {
    background: #f8fafc;
}

/* ==============================
   FILE INFORMATION
============================== */

.file-info {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.file-icon {
    font-size: 27px;
    width: 35px;
    text-align: center;
}

.file-text {
    min-width: 0;
}

.file-name {
    font-weight: bold;
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.file-description {
    margin-top: 4px;
    color: #6b7280;
    font-size: 12px;
}

.folder-name {
    color: #2563eb;
    cursor: pointer;
}

.folder-name:hover {
    text-decoration: underline;
}

/* ==============================
   SIZE
============================== */

.size {
    color: #6b7280;
    font-size: 13px;
}

/* ==============================
   ACTION
============================== */

.action {
    text-align: right;
}

.download-button {
    display: inline-block;
    padding: 8px 12px;
    border-radius: 7px;
    background: #eff6ff;
    color: #2563eb;
    text-decoration: none;
    font-size: 12px;
    font-weight: bold;
}

.download-button:hover {
    background: #2563eb;
    color: white;
}

.open-button {
    padding: 8px 12px;
    background: #f3f4f6;
    color: #374151;
    font-size: 12px;
}

.open-button:hover {
    background: #e5e7eb;
}

/* ==============================
   STATUS
============================== */

.status {
    padding: 55px 20px;
    text-align: center;
    color: #6b7280;
}

.loader {
    width: 35px;
    height: 35px;
    border: 4px solid #e5e7eb;
    border-top-color: #2563eb;
    border-radius: 50%;
    margin: auto auto 15px;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.error {
    color: #dc2626;
}

/* ==============================
   INFO
============================== */

.info-bar {
    margin-top: 12px;
    display: flex;
    justify-content: space-between;
    color: #6b7280;
    font-size: 12px;
    padding: 4px;
}

/* ==============================
   FOOTER
============================== */

.footer {
    text-align: center;
    color: #9ca3af;
    padding: 30px 15px;
    font-size: 12px;
}

/* ==============================
   MOBILE
============================== */

@media (max-width: 700px) {

    .toolbar {
        flex-direction: column;
    }

    .search {
        width: 100%;
    }

    button {
        width: 100%;
    }

    .table-header {
        display: none;
    }

    .file-row {
        display: grid;
        grid-template-columns: 1fr auto;
        padding: 14px;
    }

    .size {
        display: none;
    }

    .action {
        margin-left: 10px;
    }

    .download-text {
        display: none;
    }

    .header h1 {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<!-- ==============================
     HEADER
============================== -->

<div class="header">
    <div class="header-inner">

        <h1>📁 Brian File Storage</h1>

        <p>
            Simple file storage powered by GitHub
        </p>

    </div>
</div>


<!-- ==============================
     MAIN
============================== -->

<div class="container">

    <!-- TOOLBAR -->

    <div class="toolbar">

        <input
            id="searchInput"
            class="search"
            type="text"
            placeholder="🔍 Search files and folders..."
        >

        <button
            class="upload-button"
            id="uploadButton"
        >
            📤 Upload File
        </button>

        <button
            class="refresh-button"
            id="refreshButton"
        >
            🔄 Refresh
        </button>

    </div>


    <!-- NOTICE -->

    <div class="notice">
        ℹ️ Upload File opens GitHub's upload page.
        After uploading and committing the file,
        return here and click Refresh.
    </div>


    <!-- BREADCRUMB -->

    <div
        class="breadcrumb"
        id="breadcrumb"
    >
        🏠 Storage
    </div>


    <!-- STORAGE -->

    <div class="storage">

        <div class="table-header">

            <div>NAME</div>

            <div>SIZE</div>

            <div style="text-align:right;">
                ACTION
            </div>

        </div>


        <div id="fileList">

            <div class="status">

                <div class="loader"></div>

                Loading files...

            </div>

        </div>

    </div>


    <!-- INFO -->

    <div class="info-bar">

        <div id="fileCount">
            Loading...
        </div>

        <div>
            Public Repository
        </div>

    </div>

</div>


<!-- ==============================
     FOOTER
============================== -->

<div class="footer">

    Brian File Storage

    <br><br>

    Powered by GitHub Pages

</div>


<script>

/* =====================================================
   GITHUB CONFIGURATION
===================================================== */

const OWNER = "brianalban07";

const REPO = "Sort_Error";

const BRANCH = "main";


/* =====================================================
   VARIABLES
===================================================== */

let currentPath = "";

let currentFiles = [];


/* =====================================================
   ELEMENTS
===================================================== */

const fileList =
    document.getElementById("fileList");

const fileCount =
    document.getElementById("fileCount");

const searchInput =
    document.getElementById("searchInput");

const breadcrumb =
    document.getElementById("breadcrumb");

const uploadButton =
    document.getElementById("uploadButton");

const refreshButton =
    document.getElementById("refreshButton");


/* =====================================================
   LOAD FILES
===================================================== */

async function loadFiles(path = "") {

    currentPath = path;

    showLoading();

    updateBreadcrumb();


    try {

        let apiURL =
            "https://api.github.com/repos/" +
            OWNER +
            "/" +
            REPO +
            "/contents";


        /*
        If inside a folder,
        add folder path.
        */

        if (currentPath !== "") {

            apiURL +=
                "/" +
                encodeGitHubPath(currentPath);

        }


        /*
        IMPORTANT FIX

        Force MAIN branch
        and bypass cached API results.
        */

        apiURL +=
            "?ref=" +
            encodeURIComponent(BRANCH) +
            "&_=" +
            Date.now();


        console.log(
            "Loading GitHub API:",
            apiURL
        );


        const response =
            await fetch(
                apiURL,
                {
                    method: "GET",

                    cache: "no-store",

                    headers: {
                        "Accept":
                            "application/vnd.github+json"
                    }
                }
            );


        console.log(
            "GitHub response:",
            response.status
        );


        if (!response.ok) {

            if (response.status === 404) {

                throw new Error(
                    "Repository or folder not found."
                );

            }


            if (response.status === 403) {

                throw new Error(
                    "GitHub API request limit reached. " +
                    "Please wait and try again."
                );

            }


            throw new Error(
                "GitHub API returned HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "GitHub files:",
            data
        );


        if (!Array.isArray(data)) {

            throw new Error(
                "GitHub did not return a folder list."
            );

        }


        /*
        Hide index.html.

        We don't want the website itself
        appearing as a downloadable file.
        */

        currentFiles =
            data.filter(
                function(item) {

                    return (
                        item.name
                            .toLowerCase() !==
                        "index.html"
                    );

                }
            );


        /*
        Sort:
        folders first
        files second
        */

        currentFiles.sort(
            function(a, b) {

                if (
                    a.type === "dir" &&
                    b.type !== "dir"
                ) {

                    return -1;

                }


                if (
                    b.type === "dir" &&
                    a.type !== "dir"
                ) {

                    return 1;

                }


                return a.name.localeCompare(
                    b.name,
                    undefined,
                    {
                        numeric: true,
                        sensitivity: "base"
                    }
                );

            }
        );


        renderFiles(
            currentFiles
        );

    }

    catch (error) {

        console.error(
            "LOAD ERROR:",
            error
        );


        showError(
            error.message
        );

    }

}


/* =====================================================
   DISPLAY FILES
===================================================== */

function renderFiles(files) {

    fileList.innerHTML = "";


    if (files.length === 0) {

        fileList.innerHTML =
            '<div class="status">' +
            '📂' +
            '<br><br>' +
            'No files found.' +
            '</div>';


        updateFileCount(
            files
        );


        return;

    }


    files.forEach(
        function(item) {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "file-row";


            /* =============================================
               FOLDER
            ============================================= */

            if (item.type === "dir") {

                const info =
                    document.createElement(
                        "div"
                    );


                info.className =
                    "file-info";


                const icon =
                    document.createElement(
                        "div"
                    );


                icon.className =
                    "file-icon";


                icon.textContent =
                    "📁";


                const text =
                    document.createElement(
                        "div"
                    );


                text.className =
                    "file-text";


                const name =
                    document.createElement(
                        "div"
                    );


                name.className =
                    "file-name folder-name";


                name.textContent =
                    item.name;


                const description =
                    document.createElement(
                        "div"
                    );


                description.className =
                    "file-description";


                description.textContent =
                    "Folder";


                text.appendChild(
                    name
                );


                text.appendChild(
                    description
                );


                info.appendChild(
                    icon
                );


                info.appendChild(
                    text
                );


                /* SIZE */

                const size =
                    document.createElement(
                        "div"
                    );


                size.className =
                    "size";


                size.textContent =
                    "Folder";


                /* ACTION */

                const action =
                    document.createElement(
                        "div"
                    );


                action.className =
                    "action";


                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "open-button";


                button.textContent =
                    "📂 Open";


                button.onclick =
                    function() {

                        openFolder(
                            item.path
                        );

                    };


                name.onclick =
                    function() {

                        openFolder(
                            item.path
                        );

                    };


                action.appendChild(
                    button
                );


                row.appendChild(
                    info
                );


                row.appendChild(
                    size
                );


                row.appendChild(
                    action
                );

            }


            /* =============================================
               FILE
            ============================================= */

            else {

                const info =
                    document.createElement(
                        "div"
                    );


                info.className =
                    "file-info";


                const icon =
                    document.createElement(
                        "div"
                    );


                icon.className =
                    "file-icon";


                icon.textContent =
                    getFileIcon(
                        item.name
                    );


                const text =
                    document.createElement(
                        "div"
                    );


                text.className =
                    "file-text";


                const name =
                    document.createElement(
                        "div"
                    );


                name.className =
                    "file-name";


                name.textContent =
                    item.name;


                name.title =
                    item.name;


                const description =
                    document.createElement(
                        "div"
                    );


                description.className =
                    "file-description";


                description.textContent =
                    getFileType(
                        item.name
                    );


                text.appendChild(
                    name
                );


                text.appendChild(
                    description
                );


                info.appendChild(
                    icon
                );


                info.appendChild(
                    text
                );


                /* SIZE */

                const size =
                    document.createElement(
                        "div"
                    );


                size.className =
                    "size";


                size.textContent =
                    formatBytes(
                        item.size
                    );


                /* ACTION */

                const action =
                    document.createElement(
                        "div"
                    );


                action.className =
                    "action";


                const download =
                    document.createElement(
                        "a"
                    );


                download.className =
                    "download-button";


                download.href =
                    item.download_url;


                download.target =
                    "_blank";


                download.rel =
                    "noopener noreferrer";


                download.innerHTML =
                    "⬇ " +
                    '<span class="download-text">' +
                    "Download" +
                    "</span>";


                action.appendChild(
                    download
                );


                row.appendChild(
                    info
                );


                row.appendChild(
                    size
                );


                row.appendChild(
                    action
                );

            }


            fileList.appendChild(
                row
            );

        }
    );


    updateFileCount(
        files
    );

}


/* =====================================================
   OPEN FOLDER
===================================================== */

function openFolder(path) {

    searchInput.value =
        "";


    loadFiles(
        path
    );

}


/* =====================================================
   REFRESH
===================================================== */

refreshButton.addEventListener(
    "click",
    function() {

        searchInput.value =
            "";


        loadFiles(
            currentPath
        );

    }
);


/* =====================================================
   UPLOAD
===================================================== */

uploadButton.addEventListener(
    "click",
    function() {

        let uploadURL =
            "https://github.com/" +
            OWNER +
            "/" +
            REPO +
            "/upload/" +
            BRANCH;


        /*
        If currently inside a folder,
        upload to that folder.
        */

        if (currentPath !== "") {

            uploadURL +=
                "/" +
                encodeGitHubPath(
                    currentPath
                );

        }


        window.open(
            uploadURL,
            "_blank"
        );

    }
);


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    function() {

        const keyword =
            searchInput.value
                .trim()
                .toLowerCase();


        if (keyword === "") {

            renderFiles(
                currentFiles
            );


            return;

        }


        const filtered =
            currentFiles.filter(
                function(item) {

                    return (
                        item.name
                            .toLowerCase()
                            .includes(
                                keyword
                            )
                    );

                }
            );


        renderFiles(
            filtered
        );

    }
);


/* =====================================================
   BREADCRUMB
===================================================== */

function updateBreadcrumb() {

    breadcrumb.innerHTML =
        "";


    /* HOME */

    const home =
        document.createElement(
            "span"
        );


    home.className =
        "crumb";


    home.textContent =
        "🏠 Storage";


    home.onclick =
        function() {

            searchInput.value =
                "";


            loadFiles("");

        };


    breadcrumb.appendChild(
        home
    );


    if (currentPath === "") {

        return;

    }


    const parts =
        currentPath.split("/");


    let builtPath =
        "";


    parts.forEach(
        function(part) {

            if (part === "") {

                return;

            }


            /* SEPARATOR */

            const separator =
                document.createElement(
                    "span"
                );


            separator.className =
                "separator";


            separator.textContent =
                ">";


            breadcrumb.appendChild(
                separator
            );


            /* PATH */

            if (builtPath === "") {

                builtPath =
                    part;

            }

            else {

                builtPath +=
                    "/" +
                    part;

            }


            const savedPath =
                builtPath;


            /* CRUMB */

            const crumb =
                document.createElement(
                    "span"
                );


            crumb.className =
                "crumb";


            crumb.textContent =
                part;


            crumb.onclick =
                function() {

                    searchInput.value =
                        "";


                    loadFiles(
                        savedPath
                    );

                };


            breadcrumb.appendChild(
                crumb
            );

        }
    );

}


/* =====================================================
   FILE EXTENSION
===================================================== */

function getExtension(filename) {

    const index =
        filename.lastIndexOf(".");


    if (
        index === -1
    ) {

        return "";

    }


    return filename
        .substring(
            index + 1
        )
        .toLowerCase();

}


/* =====================================================
   FILE TYPE
===================================================== */

function getFileType(filename) {

    const extension =
        getExtension(
            filename
        );


    if (extension === "") {

        return "File";

    }


    return (
        extension.toUpperCase() +
        " File"
    );

}


/* =====================================================
   FILE ICON
===================================================== */

function getFileIcon(filename) {

    const extension =
        getExtension(
            filename
        );


    const icons = {

        /* PowerPoint */

        ppt:
            "📊",

        pptx:
            "📊",


        /* Excel */

        xls:
            "📗",

        xlsx:
            "📗",

        csv:
            "📗",


        /* Word */

        doc:
            "📘",

        docx:
            "📘",


        /* PDF */

        pdf:
            "📕",


        /* Text */

        txt:
            "📄",

        log:
            "📄",

        md:
            "📝",


        /* Images */

        jpg:
            "🖼️",

        jpeg:
            "🖼️",

        png:
            "🖼️",

        gif:
            "🖼️",

        webp:
            "🖼️",

        svg:
            "🖼️",


        /* Compressed */

        zip:
            "📦",

        rar:
            "📦",

        "7z":
            "📦",

        tar:
            "📦",

        gz:
            "📦",


        /* Video */

        mp4:
            "🎬",

        avi:
            "🎬",

        mov:
            "🎬",

        mkv:
            "🎬",


        /* Audio */

        mp3:
            "🎵",

        wav:
            "🎵",

        flac:
            "🎵",


        /* Web */

        html:
            "🌐",

        htm:
            "🌐",

        css:
            "🎨",

        js:
            "⚙️",

        json:
            "⚙️",

        xml:
            "⚙️",


        /* Scripts */

        py:
            "🐍",

        sh:
            "💻",

        bat:
            "💻",

        ps1:
            "💻"

    };


    if (
        icons[extension]
    ) {

        return icons[
            extension
        ];

    }


    return "📄";

}


/* =====================================================
   FILE SIZE
===================================================== */

function formatBytes(bytes) {

    if (
        bytes === 0
    ) {

        return "0 B";

    }


    if (
        !bytes
    ) {

        return "-";

    }


    const units = [
        "B",
        "KB",
        "MB",
        "GB",
        "TB"
    ];


    let index =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    if (
        index >= units.length
    ) {

        index =
            units.length - 1;

    }


    const result =
        bytes /
        Math.pow(
            1024,
            index
        );


    return (
        result.toFixed(
            index === 0
                ? 0
                : 1
        )
        +
        " "
        +
        units[index]
    );

}


/* =====================================================
   ENCODE PATH
===================================================== */

function encodeGitHubPath(path) {

    return path
        .split("/")
        .map(
            function(part) {

                return encodeURIComponent(
                    part
                );

            }
        )
        .join("/");

}


/* =====================================================
   FILE COUNT
===================================================== */

function updateFileCount(files) {

    const searching =
        searchInput.value
            .trim() !== "";


    if (searching) {

        fileCount.textContent =
            files.length +
            (
                files.length === 1
                    ? " result"
                    : " results"
            );


        return;

    }


    let folders =
        0;


    let filesCount =
        0;


    files.forEach(
        function(item) {

            if (
                item.type === "dir"
            ) {

                folders++;

            }

            else {

                filesCount++;

            }

        }
    );


    fileCount.textContent =
        filesCount +
        (
            filesCount === 1
                ? " file"
                : " files"
        )
        +
        " • "
        +
        folders +
        (
            folders === 1
                ? " folder"
                : " folders"
        );

}


/* =====================================================
   LOADING
===================================================== */

function showLoading() {

    fileList.innerHTML =
        '<div class="status">' +
        '<div class="loader"></div>' +
        'Loading files...' +
        '</div>';


    fileCount.textContent =
        "Loading...";

}


/* =====================================================
   ERROR
===================================================== */

function showError(message) {

    fileList.innerHTML =
        '<div class="status error">' +
        '⚠️' +
        '<br><br>' +
        '<strong>Unable to load files</strong>' +
        '<br><br>' +
        escapeHTML(message) +
        '<br><br>' +
        'Please refresh the page.' +
        '</div>';


    fileCount.textContent =
        "Unable to load files";

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* =====================================================
   INITIAL LOAD
===================================================== */

loadFiles("");

</script>
