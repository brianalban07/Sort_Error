<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brian File Storage</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f6fb;
    color: #1f2937;
}


/* =========================
   HEADER
========================= */

.header {
    background: linear-gradient(135deg, #1d4ed8, #3b82f6);
    color: white;
    padding: 28px 20px;
}

.header-inner {
    max-width: 1100px;
    margin: auto;
}

.header h1 {
    margin: 0;
    font-size: 28px;
}

.header p {
    margin: 7px 0 0;
    font-size: 14px;
    opacity: 0.9;
}


/* =========================
   MAIN
========================= */

.container {
    max-width: 1100px;
    margin: 25px auto;
    padding: 0 15px;
}


/* =========================
   TOOLBAR
========================= */

.toolbar {
    display: flex;
    gap: 10px;
    background: white;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    margin-bottom: 15px;
}

.search {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
}

.search:focus {
    border-color: #2563eb;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
}

.upload-button {
    background: #16a34a;
    color: white;
}

.upload-button:hover {
    background: #15803d;
}

.refresh-button {
    background: #2563eb;
    color: white;
}

.refresh-button:hover {
    background: #1d4ed8;
}


/* =========================
   NOTICE
========================= */

.notice {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    color: #1e40af;
    padding: 12px 15px;
    border-radius: 9px;
    margin-bottom: 15px;
    font-size: 13px;
}


/* =========================
   BREADCRUMB
========================= */

.breadcrumb {
    background: white;
    border: 1px solid #e5e7eb;
    padding: 14px 17px;
    border-radius: 10px;
    margin-bottom: 15px;
    font-size: 14px;
}

.crumb {
    color: #2563eb;
    cursor: pointer;
    font-weight: bold;
}

.crumb:hover {
    text-decoration: underline;
}

.separator {
    color: #9ca3af;
    margin: 0 6px;
}


/* =========================
   STORAGE CARD
========================= */

.storage {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}


/* =========================
   TABLE HEADER
========================= */

.table-header {
    display: grid;
    grid-template-columns: 1fr 130px 160px;
    background: #f8fafc;
    padding: 13px 18px;
    color: #6b7280;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
}


/* =========================
   FILE ROW
========================= */

.file-row {
    display: grid;
    grid-template-columns: 1fr 130px 160px;
    min-height: 68px;
    align-items: center;
    padding: 12px 18px;
    border-top: 1px solid #e5e7eb;
}

.file-row:hover {
    background: #f8fafc;
}


/* =========================
   FILE NAME
========================= */

.file-info {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.file-icon {
    font-size: 27px;
    width: 35px;
    text-align: center;
}

.file-text {
    min-width: 0;
}

.file-name {
    font-weight: bold;
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.file-description {
    margin-top: 4px;
    color: #6b7280;
    font-size: 12px;
}

.folder-name {
    color: #2563eb;
    cursor: pointer;
}

.folder-name:hover {
    text-decoration: underline;
}


/* =========================
   SIZE
========================= */

.size {
    color: #6b7280;
    font-size: 13px;
}


/* =========================
   ACTION
========================= */

.action {
    text-align: right;
}

.download-button {
    display: inline-block;
    padding: 8px 12px;
    border-radius: 7px;
    background: #eff6ff;
    color: #2563eb;
    text-decoration: none;
    font-size: 12px;
    font-weight: bold;
}

.download-button:hover {
    background: #2563eb;
    color: white;
}

.open-button {
    padding: 8px 12px;
    background: #f3f4f6;
    color: #374151;
    font-size: 12px;
}

.open-button:hover {
    background: #e5e7eb;
}


/* =========================
   STATUS
========================= */

.status {
    padding: 50px 20px;
    text-align: center;
    color: #6b7280;
}

.loader {
    width: 35px;
    height: 35px;
    border: 4px solid #e5e7eb;
    border-top-color: #2563eb;
    border-radius: 50%;
    margin: auto;
    margin-bottom: 15px;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.error {
    color: #dc2626;
}


/* =========================
   INFO BAR
========================= */

.info-bar {
    margin-top: 12px;
    display: flex;
    justify-content: space-between;
    color: #6b7280;
    font-size: 12px;
    padding: 4px;
}


/* =========================
   FOOTER
========================= */

.footer {
    text-align: center;
    color: #9ca3af;
    padding: 30px 15px;
    font-size: 12px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .toolbar {
        flex-direction: column;
    }

    .search {
        width: 100%;
    }

    button {
        width: 100%;
    }

    .table-header {
        display: none;
    }

    .file-row {
        display: grid;
        grid-template-columns: 1fr auto;
        padding: 14px;
    }

    .size {
        display: none;
    }

    .action {
        margin-left: 10px;
    }

    .download-text {
        display: none;
    }

    .header h1 {
        font-size: 23px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<div class="header">

    <div class="header-inner">

        <h1>
            📁 Brian File Storage
        </h1>

        <p>
            Simple file storage powered by GitHub
        </p>

    </div>

</div>


<!-- =========================
     MAIN
========================= -->

<div class="container">


    <!-- TOOLBAR -->

    <div class="toolbar">

        <input
            id="searchInput"
            class="search"
            type="text"
            placeholder="🔍 Search files and folders..."
        >

        <button
            class="upload-button"
            id="uploadButton"
        >
            📤 Upload File
        </button>

        <button
            class="refresh-button"
            id="refreshButton"
        >
            🔄 Refresh
        </button>

    </div>


    <!-- NOTICE -->

    <div class="notice">

        ℹ️ Upload File opens GitHub's secure upload page.
        After uploading the file, return here and click Refresh.

    </div>


    <!-- BREADCRUMB -->

    <div
        class="breadcrumb"
        id="breadcrumb"
    >
        🏠 Storage
    </div>


    <!-- STORAGE -->

    <div class="storage">


        <div class="table-header">

            <div>
                Name
            </div>

            <div>
                Size
            </div>

            <div style="text-align:right;">
                Action
            </div>

        </div>


        <div id="fileList">

            <div class="status">

                <div class="loader"></div>

                Loading files...

            </div>

        </div>


    </div>


    <!-- INFO -->

    <div class="info-bar">

        <div id="fileCount">
            Loading...
        </div>

        <div>
            Public Repository
        </div>

    </div>


</div>


<!-- FOOTER -->

<div class="footer">

    Brian File Storage

    <br><br>

    GitHub Pages

</div>


<script>

/* =========================================================
   GITHUB SETTINGS
========================================================= */

var OWNER = "brianalban07";

var REPO = "Sort_Error";

var BRANCH = "main";

var currentPath = "";

var allFiles = [];


/* =========================================================
   ELEMENTS
========================================================= */

var fileList =
    document.getElementById("fileList");

var fileCount =
    document.getElementById("fileCount");

var searchInput =
    document.getElementById("searchInput");

var breadcrumb =
    document.getElementById("breadcrumb");

var uploadButton =
    document.getElementById("uploadButton");

var refreshButton =
    document.getElementById("refreshButton");


/* =========================================================
   LOAD FILES
========================================================= */

function loadFiles(path) {

    if (typeof path === "undefined") {
        path = currentPath;
    }

    currentPath = path;


    fileList.innerHTML =
        '<div class="status">' +
        '<div class="loader"></div>' +
        'Loading files...' +
        '</div>';


    fileCount.textContent =
        "Loading...";


    updateBreadcrumb();


    var apiURL =
        "https://api.github.com/repos/" +
        OWNER +
        "/" +
        REPO +
        "/contents";


    if (currentPath !== "") {

        apiURL +=
            "/" +
            encodeGitHubPath(currentPath);

    }


    fetch(apiURL)

        .then(function(response) {

            if (!response.ok) {

                if (response.status === 404) {

                    throw new Error(
                        "Repository or folder not found."
                    );

                }

                if (response.status === 403) {

                    throw new Error(
                        "GitHub API limit reached. Please try again later."
                    );

                }

                throw new Error(
                    "GitHub API error: " +
                    response.status
                );

            }


            return response.json();

        })

        .then(function(data) {

            if (!Array.isArray(data)) {

                throw new Error(
                    "This location is not a folder."
                );

            }


            /*
             * Hide index.html because it is
             * the website itself.
             */

            data = data.filter(function(item) {

                return (
                    item.name.toLowerCase() !==
                    "index.html"
                );

            });


            /*
             * Sort folders first.
             */

            data.sort(function(a, b) {

                if (
                    a.type === "dir" &&
                    b.type !== "dir"
                ) {

                    return -1;

                }


                if (
                    b.type === "dir" &&
                    a.type !== "dir"
                ) {

                    return 1;

                }


                return a.name.localeCompare(
                    b.name
                );

            });


            allFiles = data;


            displayFiles(allFiles);

        })

        .catch(function(error) {

            fileList.innerHTML =
                '<div class="status error">' +
                '⚠️<br><br>' +
                '<strong>Unable to load files</strong>' +
                '<br><br>' +
                escapeHTML(error.message) +
                '</div>';


            fileCount.textContent =
                "Unable to load files";


            console.error(error);

        });

}


/* =========================================================
   DISPLAY FILES
========================================================= */

function displayFiles(files) {

    fileList.innerHTML = "";


    if (files.length === 0) {

        fileList.innerHTML =
            '<div class="status">' +
            '📂<br><br>' +
            'No files found.' +
            '</div>';


        updateCount(files);


        return;

    }


    files.forEach(function(item) {

        var row =
            document.createElement("div");


        row.className =
            "file-row";


        /* =================================================
           FOLDER
        ================================================= */

        if (item.type === "dir") {

            var folderInfo =
                document.createElement("div");


            folderInfo.className =
                "file-info";


            var folderIcon =
                document.createElement("div");


            folderIcon.className =
                "file-icon";


            folderIcon.textContent =
                "📁";


            var folderText =
                document.createElement("div");


            folderText.className =
                "file-text";


            var folderName =
                document.createElement("div");


            folderName.className =
                "file-name folder-name";


            folderName.textContent =
                item.name;


            var folderDescription =
                document.createElement("div");


            folderDescription.className =
                "file-description";


            folderDescription.textContent =
                "Folder";


            folderText.appendChild(
                folderName
            );


            folderText.appendChild(
                folderDescription
            );


            folderInfo.appendChild(
                folderIcon
            );


            folderInfo.appendChild(
                folderText
            );


            var folderSize =
                document.createElement("div");


            folderSize.className =
                "size";


            folderSize.textContent =
                "Folder";


            var folderAction =
                document.createElement("div");


            folderAction.className =
                "action";


            var openButton =
                document.createElement("button");


            openButton.className =
                "open-button";


            openButton.textContent =
                "📂 Open";


            folderName.onclick =
                function() {

                    openFolder(
                        item.path
                    );

                };


            openButton.onclick =
                function() {

                    openFolder(
                        item.path
                    );

                };


            folderAction.appendChild(
                openButton
            );


            row.appendChild(
                folderInfo
            );


            row.appendChild(
                folderSize
            );


            row.appendChild(
                folderAction
            );

        }


        /* =================================================
           FILE
        ================================================= */

        else {

            var info =
                document.createElement("div");


            info.className =
                "file-info";


            var icon =
                document.createElement("div");


            icon.className =
                "file-icon";


            icon.textContent =
                getFileIcon(
                    item.name
                );


            var text =
                document.createElement("div");


            text.className =
                "file-text";


            var name =
                document.createElement("div");


            name.className =
                "file-name";


            name.textContent =
                item.name;


            var description =
                document.createElement("div");


            description.className =
                "file-description";


            description.textContent =
                getFileType(
                    item.name
                );


            text.appendChild(
                name
            );


            text.appendChild(
                description
            );


            info.appendChild(
                icon
            );


            info.appendChild(
                text
            );


            var size =
                document.createElement("div");


            size.className =
                "size";


            size.textContent =
                formatBytes(
                    item.size
                );


            var action =
                document.createElement("div");


            action.className =
                "action";


            var download =
                document.createElement("a");


            download.className =
                "download-button";


            download.href =
                item.download_url;


            download.target =
                "_blank";


            download.rel =
                "noopener noreferrer";


            download.innerHTML =
                '⬇ <span class="download-text">' +
                'Download' +
                '</span>';


            action.appendChild(
                download
            );


            row.appendChild(
                info
            );


            row.appendChild(
                size
            );


            row.appendChild(
                action
            );

        }


        fileList.appendChild(
            row
        );

    });


    updateCount(files);

}


/* =========================================================
   OPEN FOLDER
========================================================= */

function openFolder(path) {

    searchInput.value =
        "";


    loadFiles(path);

}


/* =========================================================
   BREADCRUMB
========================================================= */

function updateBreadcrumb() {

    breadcrumb.innerHTML =
        "";


    var home =
        document.createElement("span");


    home.className =
        "crumb";


    home.textContent =
        "🏠 Storage";


    home.onclick =
        function() {

            searchInput.value =
                "";


            loadFiles("");

        };


    breadcrumb.appendChild(
        home
    );


    if (
        currentPath === ""
    ) {

        return;

    }


    var pieces =
        currentPath.split("/");


    var path =
        "";


    pieces.forEach(
        function(piece) {

            path =
                path === ""
                    ? piece
                    : path + "/" + piece;


            var savedPath =
                path;


            var separator =
                document.createElement("span");


            separator.className =
                "separator";


            separator.textContent =
                ">";


            breadcrumb.appendChild(
                separator
            );


            var crumb =
                document.createElement("span");


            crumb.className =
                "crumb";


            crumb.textContent =
                piece;


            crumb.onclick =
                function() {

                    searchInput.value =
                        "";


                    loadFiles(
                        savedPath
                    );

                };


            breadcrumb.appendChild(
                crumb
            );

        }
    );

}


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    function() {

        var keyword =
            searchInput.value
                .toLowerCase()
                .trim();


        if (
            keyword === ""
        ) {

            displayFiles(
                allFiles
            );


            return;

        }


        var filtered =
            allFiles.filter(
                function(item) {

                    return (
                        item.name
                            .toLowerCase()
                            .indexOf(
                                keyword
                            ) !== -1
                    );

                }
            );


        displayFiles(
            filtered
        );

    }
);


/* =========================================================
   REFRESH BUTTON
========================================================= */

refreshButton.addEventListener(
    "click",
    function() {

        searchInput.value =
            "";


        loadFiles(
            currentPath
        );

    }
);


/* =========================================================
   UPLOAD BUTTON
========================================================= */

uploadButton.addEventListener(
    "click",
    function() {

        var url =
            "https://github.com/" +
            OWNER +
            "/" +
            REPO +
            "/upload/" +
            BRANCH;


        if (
            currentPath !== ""
        ) {

            url +=
                "/" +
                encodeGitHubPath(
                    currentPath
                );

        }


        window.open(
            url,
            "_blank"
        );

    }
);


/* =========================================================
   ENCODE GITHUB PATH
========================================================= */

function encodeGitHubPath(path) {

    return path
        .split("/")
        .map(function(part) {

            return encodeURIComponent(
                part
            );

        })
        .join("/");

}


/* =========================================================
   FILE ICONS
========================================================= */

function getFileIcon(filename) {

    var extension =
        getExtension(filename);


    var icons = {

        "ppt": "📊",
        "pptx": "📊",

        "xls": "📗",
        "xlsx": "📗",
        "csv": "📗",

        "doc": "📘",
        "docx": "📘",

        "pdf": "📕",

        "txt": "📄",
        "log": "📄",
        "md": "📝",

        "zip": "📦",
        "rar": "📦",
        "7z": "📦",
        "tar": "📦",
        "gz": "📦",

        "jpg": "🖼️",
        "jpeg": "🖼️",
        "png": "🖼️",
        "gif": "🖼️",
        "webp": "🖼️",

        "mp4": "🎬",
        "avi": "🎬",
        "mov": "🎬",
        "mkv": "🎬",

        "mp3": "🎵",
        "wav": "🎵",

        "html": "🌐",
        "css": "🎨",
        "js": "⚙️",
        "json": "⚙️",

        "py": "🐍",
        "sh": "💻",
        "bat": "💻",
        "ps1": "💻"

    };


    if (
        icons[extension]
    ) {

        return icons[extension];

    }


    return "📄";

}


/* =========================================================
   GET EXTENSION
========================================================= */

function getExtension(filename) {

    var pieces =
        filename.split(".");


    if (
        pieces.length < 2
    ) {

        return "";

    }


    return pieces[
        pieces.length - 1
    ].toLowerCase();

}


/* =========================================================
   FILE TYPE
========================================================= */

function getFileType(filename) {

    var extension =
        getExtension(filename);


    if (
        extension === ""
    ) {

        return "File";

    }


    return (
        extension.toUpperCase() +
        " File"
    );

}


/* =========================================================
   FILE SIZE
========================================================= */

function formatBytes(bytes) {

    if (
        bytes === 0
    ) {

        return "0 B";

    }


    if (
        !bytes
    ) {

        return "-";

    }


    var units = [
        "B",
        "KB",
        "MB",
        "GB"
    ];


    var index =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    if (
        index >= units.length
    ) {

        index =
            units.length - 1;

    }


    var result =
        bytes /
        Math.pow(
            1024,
            index
        );


    return (
        result.toFixed(
            index === 0
                ? 0
                : 1
        ) +
        " " +
        units[index]
    );

}


/* =========================================================
   COUNT
========================================================= */

function updateCount(files) {

    var folders =
        0;


    var fileTotal =
        0;


    files.forEach(
        function(item) {

            if (
                item.type === "dir"
            ) {

                folders++;

            }

            else {

                fileTotal++;

            }

        }
    );


    fileCount.textContent =
        fileTotal +
        " file" +
        (
            fileTotal === 1
                ? ""
                : "s"
        ) +
        " • " +
        folders +
        " folder" +
        (
            folders === 1
                ? ""
                : "s"
        );

}


/* =========================================================
   BASIC HTML ESCAPE
========================================================= */

function escapeHTML(text) {

    var div =
        document.createElement("div");


    div.textContent =
        text;


    return div.innerHTML;

}


/* =========================================================
   START APPLICATION
========================================================= */

loadFiles("");

</script>


</body>

</html>
