<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brian File Storage</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f6fb;
    color: #1f2937;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    background: linear-gradient(
        135deg,
        #1d4ed8,
        #3b82f6
    );

    color: white;
    padding: 28px 20px;
}

.header-inner {
    max-width: 1200px;
    margin: auto;
}

.header h1 {
    margin: 0;
    font-size: 28px;
}

.header p {
    margin: 7px 0 0;
    font-size: 14px;
    opacity: 0.9;
}


/* =====================================================
   MAIN
===================================================== */

.container {
    max-width: 1200px;
    margin: 25px auto;
    padding: 0 15px;
}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar {
    display: flex;
    gap: 10px;
    background: white;
    padding: 15px;

    border:
        1px solid
        #e5e7eb;

    border-radius: 12px;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,0.04);

    margin-bottom: 15px;
}

.search {
    flex: 1;

    padding:
        12px 14px;

    border:
        1px solid
        #d1d5db;

    border-radius: 8px;

    font-size: 14px;

    outline: none;
}

.search:focus {
    border-color: #2563eb;
}

button {
    border: none;
    border-radius: 8px;

    padding:
        11px 16px;

    cursor: pointer;

    font-size: 14px;
    font-weight: bold;

    transition: 0.2s;
}

.upload-button {
    background: #16a34a;
    color: white;
}

.upload-button:hover {
    background: #15803d;
}

.upload-button:disabled {
    background: #86b997;
    cursor: not-allowed;
}

.refresh-button {
    background: #2563eb;
    color: white;
}

.refresh-button:hover {
    background: #1d4ed8;
}


/* =====================================================
   UPLOAD STATUS
===================================================== */

.upload-area {
    display: none;

    background: white;

    border:
        1px solid
        #e5e7eb;

    border-radius: 12px;

    padding: 18px;

    margin-bottom: 15px;
}

.upload-header {
    display: flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap: 10px;

    margin-bottom:
        12px;
}

.upload-title {
    font-size: 14px;
    font-weight: bold;
}

.upload-percent {
    color: #16a34a;

    font-size: 13px;
    font-weight: bold;
}

.progress-background {
    width: 100%;
    height: 10px;

    background:
        #e5e7eb;

    border-radius:
        10px;

    overflow: hidden;
}

.progress-bar {
    width: 0%;
    height: 100%;

    background:
        #16a34a;

    border-radius:
        10px;

    transition:
        width 0.25s ease;
}

.upload-message {
    margin-top: 10px;

    color:
        #6b7280;

    font-size:
        13px;
}

.upload-success {
    color: #15803d;
    font-weight: bold;
}

.upload-error {
    color: #dc2626;
    font-weight: bold;
}


/* =====================================================
   DROP AREA
===================================================== */

.drop-area {
    display: none;

    border:
        2px dashed
        #60a5fa;

    background:
        #eff6ff;

    color:
        #1e40af;

    border-radius:
        12px;

    padding:
        35px 20px;

    text-align:
        center;

    margin-bottom:
        15px;

    font-size:
        15px;

    font-weight:
        bold;
}

.drop-area.active {
    display: block;
}


/* =====================================================
   BREADCRUMB
===================================================== */

.breadcrumb {
    background: white;

    border:
        1px solid
        #e5e7eb;

    padding:
        14px 17px;

    border-radius:
        10px;

    margin-bottom:
        15px;

    font-size:
        14px;
}

.crumb {
    color:
        #2563eb;

    cursor:
        pointer;

    font-weight:
        bold;
}

.crumb:hover {
    text-decoration:
        underline;
}

.separator {
    color:
        #9ca3af;

    margin:
        0 6px;
}


/* =====================================================
   STORAGE
===================================================== */

.storage {
    background:
        white;

    border:
        1px solid
        #e5e7eb;

    border-radius:
        12px;

    overflow:
        hidden;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,0.04);
}


/* =====================================================
   TABLE HEADER
===================================================== */

.table-header {
    display: grid;

    grid-template-columns:
        minmax(300px,1fr)
        120px
        310px;

    background:
        #f8fafc;

    padding:
        13px 18px;

    color:
        #6b7280;

    font-size:
        12px;

    font-weight:
        bold;
}


/* =====================================================
   FILE ROW
===================================================== */

.file-row {
    display: grid;

    grid-template-columns:
        minmax(300px,1fr)
        120px
        310px;

    min-height:
        68px;

    align-items:
        center;

    padding:
        12px 18px;

    border-top:
        1px solid
        #e5e7eb;

    transition:
        background 0.15s;
}

.file-row:hover {
    background:
        #f8fafc;
}


/* =====================================================
   FILE INFO
===================================================== */

.file-info {
    display: flex;

    align-items:
        center;

    gap:
        12px;

    min-width:
        0;
}

.file-icon {
    font-size:
        27px;

    width:
        35px;

    text-align:
        center;

    flex-shrink:
        0;
}

.file-text {
    min-width:
        0;
}

.file-name {
    font-weight:
        bold;

    font-size:
        14px;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

    white-space:
        nowrap;
}

.file-description {
    margin-top:
        4px;

    color:
        #6b7280;

    font-size:
        12px;
}

.folder-name {
    color:
        #2563eb;

    cursor:
        pointer;
}

.folder-name:hover {
    text-decoration:
        underline;
}


/* =====================================================
   SIZE
===================================================== */

.size {
    color:
        #6b7280;

    font-size:
        13px;
}


/* =====================================================
   ACTIONS
===================================================== */

.action {
    display: flex;

    justify-content:
        flex-end;

    align-items:
        center;

    gap:
        6px;

    flex-wrap:
        wrap;
}


/* DOWNLOAD */

.download-button {
    display:
        inline-block;

    padding:
        8px 10px;

    border-radius:
        7px;

    border:
        1px solid
        #dbeafe;

    background:
        #eff6ff;

    color:
        #2563eb;

    text-decoration:
        none;

    font-size:
        12px;

    font-weight:
        bold;

    transition:
        0.2s;
}

.download-button:hover {
    background:
        #2563eb;

    color:
        white;
}


/* RENAME */

.rename-button {
    padding:
        8px 10px;

    border-radius:
        7px;

    border:
        1px solid
        #fed7aa;

    background:
        #fff7ed;

    color:
        #ea580c;

    font-size:
        12px;

    font-weight:
        bold;
}

.rename-button:hover {
    background:
        #ea580c;

    color:
        white;
}


/* DELETE */

.delete-button {
    padding:
        8px 10px;

    border-radius:
        7px;

    border:
        1px solid
        #fecaca;

    background:
        #fef2f2;

    color:
        #dc2626;

    font-size:
        12px;

    font-weight:
        bold;
}

.delete-button:hover {
    background:
        #dc2626;

    color:
        white;
}


/* OPEN FOLDER */

.open-button {
    padding:
        8px 12px;

    background:
        #f3f4f6;

    color:
        #374151;

    font-size:
        12px;
}

.open-button:hover {
    background:
        #e5e7eb;
}


/* =====================================================
   STATUS
===================================================== */

.status {
    padding:
        55px 20px;

    text-align:
        center;

    color:
        #6b7280;
}

.loader {
    width:
        35px;

    height:
        35px;

    border:
        4px solid
        #e5e7eb;

    border-top-color:
        #2563eb;

    border-radius:
        50%;

    margin:
        auto auto 15px;

    animation:
        spin 0.8s
        linear infinite;
}

@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }

}

.error {
    color:
        #dc2626;
}


/* =====================================================
   INFO
===================================================== */

.info-bar {
    margin-top:
        12px;

    display: flex;

    justify-content:
        space-between;

    color:
        #6b7280;

    font-size:
        12px;

    padding:
        4px;
}


/* =====================================================
   FOOTER
===================================================== */

.footer {
    text-align:
        center;

    color:
        #9ca3af;

    padding:
        30px 15px;

    font-size:
        12px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (
    max-width: 700px
) {

    .toolbar {
        flex-direction:
            column;
    }

    .search {
        width:
            100%;
    }

    .toolbar button {
        width:
            100%;
    }

    .table-header {
        display:
            none;
    }

    .file-row {
        display:
            block;

        padding:
            14px;
    }

    .size {
        margin-top:
            8px;

        margin-left:
            47px;
    }

    .action {
        margin-top:
            12px;

        margin-left:
            47px;

        justify-content:
            flex-start;
    }

    .header h1 {
        font-size:
            23px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <div class="header-inner">

        <h1>
            📁 Brian File Storage
        </h1>

        <p>
            Upload, browse, download and manage files
        </p>

    </div>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="container">


    <!-- TOOLBAR -->

    <div class="toolbar">

        <input
            id="searchInput"
            class="search"
            type="text"
            placeholder="🔍 Search files and folders..."
            autocomplete="off"
        >


        <button
            class="upload-button"
            id="uploadButton"
        >
            📤 Upload File
        </button>


        <button
            class="refresh-button"
            id="refreshButton"
        >
            🔄 Refresh
        </button>


        <input
            id="fileInput"
            type="file"
            hidden
            multiple
        >

    </div>


    <!-- DRAG & DROP -->

    <div
        id="dropArea"
        class="drop-area"
    >

        📤 Drop files here to upload

        <br><br>

        Files will upload automatically.

    </div>


    <!-- OPERATION STATUS -->

    <div
        id="uploadArea"
        class="upload-area"
    >

        <div class="upload-header">

            <div
                id="uploadTitle"
                class="upload-title"
            >
                Working...
            </div>


            <div
                id="uploadPercent"
                class="upload-percent"
            >
                0%
            </div>

        </div>


        <div class="progress-background">

            <div
                id="uploadProgress"
                class="progress-bar"
            ></div>

        </div>


        <div
            id="uploadMessage"
            class="upload-message"
        >
            Preparing...
        </div>

    </div>


    <!-- BREADCRUMB -->

    <div
        id="breadcrumb"
        class="breadcrumb"
    >

        🏠 Storage

    </div>


    <!-- STORAGE -->

    <div class="storage">

        <div class="table-header">

            <div>
                NAME
            </div>

            <div>
                SIZE
            </div>

            <div style="text-align:right;">
                ACTION
            </div>

        </div>


        <div id="fileList">

            <div class="status">

                <div class="loader"></div>

                Loading files...

            </div>

        </div>

    </div>


    <!-- INFO -->

    <div class="info-bar">

        <div id="fileCount">
            Loading...
        </div>


        <div>
            GitHub File Storage
        </div>

    </div>

</div>


<!-- =====================================================
     FOOTER
===================================================== -->

<div class="footer">

    <strong>
        Brian File Storage
    </strong>

    <br><br>

    Powered by GitHub Pages

</div>


<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const OWNER =
    "brianalban07";


const REPO =
    "Sort_Error";


const BRANCH =
    "main";


const WORKER_URL =
    "https://brian-file-storage.brianalban07.workers.dev";


/* =====================================================
   VARIABLES
===================================================== */

let currentPath =
    "";


let currentFiles =
    [];


let uploading =
    false;


/* =====================================================
   ELEMENTS
===================================================== */

const fileList =
    document.getElementById(
        "fileList"
    );


const fileCount =
    document.getElementById(
        "fileCount"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const breadcrumb =
    document.getElementById(
        "breadcrumb"
    );


const uploadButton =
    document.getElementById(
        "uploadButton"
    );


const refreshButton =
    document.getElementById(
        "refreshButton"
    );


const fileInput =
    document.getElementById(
        "fileInput"
    );


const uploadArea =
    document.getElementById(
        "uploadArea"
    );


const uploadTitle =
    document.getElementById(
        "uploadTitle"
    );


const uploadPercent =
    document.getElementById(
        "uploadPercent"
    );


const uploadProgress =
    document.getElementById(
        "uploadProgress"
    );


const uploadMessage =
    document.getElementById(
        "uploadMessage"
    );


const dropArea =
    document.getElementById(
        "dropArea"
    );


/* =====================================================
   LOAD FILES
===================================================== */

async function loadFiles(
    path = ""
) {

    currentPath =
        path;


    showLoading();


    updateBreadcrumb();


    try {

        let apiURL =
            "https://api.github.com/repos/" +
            OWNER +
            "/" +
            REPO +
            "/contents";


        if (
            currentPath !== ""
        ) {

            apiURL +=
                "/" +
                encodeGitHubPath(
                    currentPath
                );

        }


        apiURL +=
            "?ref=" +
            encodeURIComponent(
                BRANCH
            ) +
            "&_=" +
            Date.now();


        const response =
            await fetch(
                apiURL,
                {

                    cache:
                        "no-store",

                    headers: {

                        "Accept":
                            "application/vnd.github+json"

                    }

                }
            );


        if (
            !response.ok
        ) {

            if (
                response.status === 404
            ) {

                throw new Error(
                    "Repository or folder not found."
                );

            }


            if (
                response.status === 403
            ) {

                throw new Error(
                    "GitHub API request limit reached."
                );

            }


            throw new Error(
                "GitHub returned HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if (
            !Array.isArray(data)
        ) {

            throw new Error(
                "GitHub did not return a folder list."
            );

        }


        /* Hide index.html */

        currentFiles =
            data.filter(
                function(item) {

                    return (
                        item.name
                            .toLowerCase() !==
                        "index.html"
                    );

                }
            );


        /* Folders first */

        currentFiles.sort(
            function(a, b) {

                if (
                    a.type === "dir" &&
                    b.type !== "dir"
                ) {

                    return -1;

                }


                if (
                    b.type === "dir" &&
                    a.type !== "dir"
                ) {

                    return 1;

                }


                return (
                    a.name.localeCompare(
                        b.name,
                        undefined,
                        {
                            numeric:
                                true,

                            sensitivity:
                                "base"
                        }
                    )
                );

            }
        );


        renderFiles(
            currentFiles
        );

    }

    catch (
        error
    ) {

        console.error(
            error
        );


        showError(
            error.message
        );

    }

}


/* =====================================================
   RENDER FILES
===================================================== */

function renderFiles(
    files
) {

    fileList.innerHTML =
        "";


    if (
        files.length === 0
    ) {

        fileList.innerHTML =
            '<div class="status">' +
            '📂' +
            '<br><br>' +
            'No files found.' +
            '</div>';


        updateFileCount(
            files
        );


        return;

    }


    files.forEach(
        function(item) {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "file-row";


            /* =================================================
               FOLDER
            ================================================= */

            if (
                item.type === "dir"
            ) {

                const info =
                    document.createElement(
                        "div"
                    );


                info.className =
                    "file-info";


                const icon =
                    document.createElement(
                        "div"
                    );


                icon.className =
                    "file-icon";


                icon.textContent =
                    "📁";


                const text =
                    document.createElement(
                        "div"
                    );


                text.className =
                    "file-text";


                const name =
                    document.createElement(
                        "div"
                    );


                name.className =
                    "file-name folder-name";


                name.textContent =
                    item.name;


                const description =
                    document.createElement(
                        "div"
                    );


                description.className =
                    "file-description";


                description.textContent =
                    "Folder";


                text.appendChild(
                    name
                );


                text.appendChild(
                    description
                );


                info.appendChild(
                    icon
                );


                info.appendChild(
                    text
                );


                const size =
                    document.createElement(
                        "div"
                    );


                size.className =
                    "size";


                size.textContent =
                    "Folder";


                const action =
                    document.createElement(
                        "div"
                    );


                action.className =
                    "action";


                const openButton =
                    document.createElement(
                        "button"
                    );


                openButton.className =
                    "open-button";


                openButton.textContent =
                    "📂 Open";


                openButton.onclick =
                    function() {

                        openFolder(
                            item.path
                        );

                    };


                name.onclick =
                    function() {

                        openFolder(
                            item.path
                        );

                    };


                action.appendChild(
                    openButton
                );


                row.appendChild(
                    info
                );


                row.appendChild(
                    size
                );


                row.appendChild(
                    action
                );

            }


            /* =================================================
               FILE
            ================================================= */

            else {

                const info =
                    document.createElement(
                        "div"
                    );


                info.className =
                    "file-info";


                const icon =
                    document.createElement(
                        "div"
                    );


                icon.className =
                    "file-icon";


                icon.textContent =
                    getFileIcon(
                        item.name
                    );


                const text =
                    document.createElement(
                        "div"
                    );


                text.className =
                    "file-text";


                const name =
                    document.createElement(
                        "div"
                    );


                name.className =
                    "file-name";


                name.textContent =
                    item.name;


                name.title =
                    item.name;


                const description =
                    document.createElement(
                        "div"
                    );


                description.className =
                    "file-description";


                description.textContent =
                    getFileType(
                        item.name
                    );


                text.appendChild(
                    name
                );


                text.appendChild(
                    description
                );


                info.appendChild(
                    icon
                );


                info.appendChild(
                    text
                );


                const size =
                    document.createElement(
                        "div"
                    );


                size.className =
                    "size";


                size.textContent =
                    formatBytes(
                        item.size
                    );


                const action =
                    document.createElement(
                        "div"
                    );


                action.className =
                    "action";


                /* =============================================
                   DOWNLOAD
                ============================================= */

                const download =
                    document.createElement(
                        "a"
                    );


                download.className =
                    "download-button";


                download.href =
                    item.download_url;


                download.target =
                    "_blank";


                download.rel =
                    "noopener noreferrer";


                download.textContent =
                    "⬇ Download";


                action.appendChild(
                    download
                );


                /* =============================================
                   RENAME
                ============================================= */

                const renameButton =
                    document.createElement(
                        "button"
                    );


                renameButton.className =
                    "rename-button";


                renameButton.textContent =
                    "✏️ Rename";


                renameButton.onclick =
                    function() {

                        renameFile(
                            item
                        );

                    };


                action.appendChild(
                    renameButton
                );


                /* =============================================
                   DELETE
                ============================================= */

                const deleteButton =
                    document.createElement(
                        "button"
                    );


                deleteButton.className =
                    "delete-button";


                deleteButton.textContent =
                    "🗑 Delete";


                deleteButton.onclick =
                    function() {

                        deleteFile(
                            item
                        );

                    };


                action.appendChild(
                    deleteButton
                );


                row.appendChild(
                    info
                );


                row.appendChild(
                    size
                );


                row.appendChild(
                    action
                );

            }


            fileList.appendChild(
                row
            );

        }
    );


    updateFileCount(
        files
    );

}


/* =====================================================
   UPLOAD BUTTON
===================================================== */

uploadButton.addEventListener(
    "click",
    function() {

        if (
            uploading
        ) {

            return;

        }


        fileInput.click();

    }
);


/* =====================================================
   FILE SELECTED
===================================================== */

fileInput.addEventListener(
    "change",
    async function() {

        const files =
            Array.from(
                fileInput.files
            );


        if (
            files.length === 0
        ) {

            return;

        }


        await uploadFiles(
            files
        );


        fileInput.value =
            "";

    }
);


/* =====================================================
   UPLOAD FILES
===================================================== */

async function uploadFiles(
    files
) {

    if (
        uploading ||
        files.length === 0
    ) {

        return;

    }


    uploading =
        true;


    uploadButton.disabled =
        true;


    showOperation(
        "Preparing Upload",
        "Preparing files..."
    );


    uploadProgress.style.width =
        "0%";


    uploadPercent.textContent =
        "0%";


    let successCount =
        0;


    let failedCount =
        0;


    for (
        let i = 0;
        i < files.length;
        i++
    ) {

        const file =
            files[i];


        uploadTitle.textContent =
            "Uploading " +
            (i + 1) +
            " of " +
            files.length;


        uploadMessage.className =
            "upload-message";


        uploadMessage.textContent =
            file.name;


        /* Maximum 100 MB */

        if (
            file.size >
            100 * 1024 * 1024
        ) {

            failedCount++;


            uploadMessage.className =
                "upload-message upload-error";


            uploadMessage.textContent =
                "❌ File is larger than 100 MB: " +
                file.name;


            continue;

        }


        try {

            const base64 =
                await fileToBase64(
                    file
                );


            const response =
                await fetch(
                    WORKER_URL +
                    "/upload",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(
                                {

                                    filename:
                                        file.name,

                                    path:
                                        currentPath,

                                    content:
                                        base64

                                }
                            )

                    }
                );


            const result =
                await safeResponseJSON(
                    response
                );


            if (
                !response.ok
            ) {

                throw new Error(
                    result.error ||
                    "Upload failed."
                );

            }


            successCount++;

        }

        catch (
            error
        ) {

            failedCount++;


            console.error(
                error
            );


            uploadMessage.className =
                "upload-message upload-error";


            uploadMessage.textContent =
                "❌ " +
                file.name +
                ": " +
                error.message;

        }


        const percent =
            Math.round(
                (
                    (i + 1) /
                    files.length
                ) *
                100
            );


        uploadProgress.style.width =
            percent +
            "%";


        uploadPercent.textContent =
            percent +
            "%";

    }


    if (
        failedCount === 0
    ) {

        uploadTitle.textContent =
            "Upload Complete";


        uploadMessage.className =
            "upload-message upload-success";


        uploadMessage.textContent =
            "✅ " +
            successCount +
            (
                successCount === 1
                    ? " file uploaded successfully."
                    : " files uploaded successfully."
            );

    }

    else {

        uploadTitle.textContent =
            "Upload Finished";


        uploadMessage.className =
            "upload-message upload-error";


        uploadMessage.textContent =
            "✅ " +
            successCount +
            " uploaded • ❌ " +
            failedCount +
            " failed";

    }


    uploadProgress.style.width =
        "100%";


    uploadPercent.textContent =
        "100%";


    searchInput.value =
        "";


    await wait(
        1000
    );


    await loadFiles(
        currentPath
    );


    uploading =
        false;


    uploadButton.disabled =
        false;


    if (
        failedCount === 0
    ) {

        hideOperationLater();

    }

}


/* =====================================================
   RENAME FILE
===================================================== */

async function renameFile(
    item
) {

    if (
        uploading
    ) {

        return;

    }


    const oldName =
        item.name;


    const newName =
        prompt(
            "Enter the new filename:",
            oldName
        );


    if (
        newName === null
    ) {

        return;

    }


    const cleanedName =
        newName.trim();


    if (
        cleanedName === ""
    ) {

        alert(
            "Filename cannot be empty."
        );


        return;

    }


    if (
        cleanedName === oldName
    ) {

        return;

    }


    if (
        cleanedName.includes("/") ||
        cleanedName.includes("\\")
    ) {

        alert(
            "Filename cannot contain / or \\."
        );


        return;

    }


    /*
        Recommend preserving the extension.
    */

    const oldExtension =
        getExtension(
            oldName
        );


    const newExtension =
        getExtension(
            cleanedName
        );


    if (
        oldExtension !== "" &&
        oldExtension !== newExtension
    ) {

        const continueRename =
            confirm(
                "Warning:\n\n" +
                "The file extension will change from ." +
                oldExtension +
                " to ." +
                newExtension +
                ".\n\n" +
                "The file may no longer open correctly.\n\n" +
                "Continue?"
            );


        if (
            !continueRename
        ) {

            return;

        }

    }


    const confirmed =
        confirm(
            "Rename this file?\n\n" +
            oldName +
            "\n\n→\n\n" +
            cleanedName
        );


    if (
        !confirmed
    ) {

        return;

    }


    try {

        showOperation(
            "Renaming File",
            oldName +
            " → " +
            cleanedName
        );


        uploadPercent.textContent =
            "";


        uploadProgress.style.width =
            "100%";


        const response =
            await fetch(
                WORKER_URL +
                "/rename",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            {

                                path:
                                    item.path,

                                newName:
                                    cleanedName

                            }
                        )

                }
            );


        const result =
            await safeResponseJSON(
                response
            );


        if (
            !response.ok
        ) {

            throw new Error(
                result.error ||
                "Rename failed."
            );

        }


        uploadTitle.textContent =
            "Rename Complete";


        uploadMessage.className =
            "upload-message upload-success";


        uploadMessage.textContent =
            "✅ " +
            oldName +
            " renamed to " +
            cleanedName;


        searchInput.value =
            "";


        await wait(
            700
        );


        await loadFiles(
            currentPath
        );


        hideOperationLater();

    }

    catch (
        error
    ) {

        console.error(
            error
        );


        uploadTitle.textContent =
            "Rename Failed";


        uploadMessage.className =
            "upload-message upload-error";


        uploadMessage.textContent =
            "❌ " +
            error.message;


        alert(
            "Unable to rename file:\n\n" +
            error.message
        );

    }

}

/* =====================================================
   FILE → BASE64
===================================================== */

function fileToBase64(
    file
) {

    return new Promise(
        function(
            resolve,
            reject
        ) {

            const reader =
                new FileReader();


            reader.onload =
                function() {

                    const result =
                        String(
                            reader.result
                        );


                    const commaIndex =
                        result.indexOf(
                            ","
                        );


                    if (
                        commaIndex === -1
                    ) {

                        reject(
                            new Error(
                                "Unable to convert file."
                            )
                        );


                        return;

                    }


                    resolve(
                        result.substring(
                            commaIndex + 1
                        )
                    );

                };


            reader.onerror =
                function() {

                    reject(
                        new Error(
                            "Unable to read file."
                        )
                    );

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =====================================================
   DRAG AND DROP
===================================================== */

let dragCounter =
    0;


document.addEventListener(
    "dragenter",
    function(event) {

        event.preventDefault();


        dragCounter++;


        if (
            !uploading
        ) {

            dropArea.classList.add(
                "active"
            );

        }

    }
);


document.addEventListener(
    "dragover",
    function(event) {

        event.preventDefault();

    }
);


document.addEventListener(
    "dragleave",
    function(event) {

        event.preventDefault();


        dragCounter--;


        if (
            dragCounter <= 0
        ) {

            dragCounter =
                0;


            dropArea.classList.remove(
                "active"
            );

        }

    }
);


document.addEventListener(
    "drop",
    async function(event) {

        event.preventDefault();


        dragCounter =
            0;


        dropArea.classList.remove(
            "active"
        );


        if (
            uploading
        ) {

            return;

        }


        const files =
            Array.from(
                event.dataTransfer.files
            );


        if (
            files.length
        ) {

            await uploadFiles(
                files
            );

        }

    }
);

            searchInput.value

            keyword === ""
        ) {

            renderFiles(
                currentFiles
            );


            return;

        }


        const filtered =
            currentFiles.filter(
                function(item) {

                    return (
                        item.name
                            .toLowerCase()
                            .includes(
                                keyword
                            )
                    );

                }
            );


        renderFiles(
            filtered
        );

    }
);

            "span"
        );


    home.className =
        "crumb";


    home.textContent =

    );

        currentPath === ""
    ) {

        return;

    }


    const parts =
        currentPath.split(
            "/"
        );


    let builtPath =
        "";


    parts.forEach(
        function(part) {

            if (
                part === ""
            ) {

                return;

            }


            const separator =
                document.createElement(
                    "span"
                );


            separator.className =
                "separator";


            separator.textContent =
                ">";


            breadcrumb.appendChild(
                separator
            );


            if (
                builtPath === ""
            ) {

                builtPath =
                    part;

            }

            else {

                builtPath +=
                    "/" +
                    part;

            }


            const savedPath =
                builtPath;


            const crumb =
                document.createElement(
                    "span"
                );


            crumb.className =
                "crumb";


            crumb.textContent =
                part;


            crumb.onclick =
                function() {

                    searchInput.value =
                        "";


                    loadFiles(
                        savedPath
                    );

                };


            breadcrumb.appendChild(
                crumb
            );

        }
    );

}


/* =====================================================
   FILE EXTENSION
===================================================== */

function getExtension(
    filename
) {

    const index =
        filename.lastIndexOf(
            "."
        );


    if (
        index === -1 ||
        index === filename.length - 1
    ) {

        return "";

    }


    return filename
        .substring(
            index + 1
        )
        .toLowerCase();

}


/* =====================================================
   FILE TYPE
===================================================== */

function getFileType(
    filename
) {

    const extension =
        getExtension(
            filename
        );


    if (
        extension === ""
    ) {

        return "File";

    }


    return (
        extension.toUpperCase() +
        " File"
    );

}

/* =====================================================
   FILE SIZE
===================================================== */

function formatBytes(
    bytes
) {

    if (
        bytes === 0
    ) {

        return "0 B";

    }


    if (
        !bytes
    ) {

        return "-";

    }


    const units = [
        "B",
        "KB",
        "MB",
        "GB",
        "TB"
    ];


    let index =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    index =
        Math.min(
            index,
            units.length - 1
        );


    const result =
        bytes /
        Math.pow(
            1024,
            index
        );


    return (
        result.toFixed(
            index === 0
                ? 0
                : 1
        )
        +
        " "
        +
        units[index]
    );

}


/* =====================================================
   ENCODE PATH
===================================================== */

function encodeGitHubPath(
    path
) {

    return path

        .split("/")

        .map(
            function(part) {

                return encodeURIComponent(
                    part
                );

            }
        )

        .join("/");

}


/* =====================================================
   FILE COUNT
===================================================== */

function updateFileCount(
    files
) {

    const searching =
        searchInput.value
            .trim() !== "";


    if (
        searching
    ) {

        fileCount.textContent =
            files.length +
            (
                files.length === 1
                    ? " result"
                    : " results"
            );


        return;

    }


    let folders =
        0;


    let filesCount =
        0;


    files.forEach(
        function(item) {

            if (
                item.type === "dir"
            ) {

                folders++;

            }

            else {

                filesCount++;

            }

        }
    );


    fileCount.textContent =
        filesCount +
        (
            filesCount === 1
                ? " file"
                : " files"
        )
        +
        " • "
        +
        folders +
        (
            folders === 1
                ? " folder"
                : " folders"
        );

}

/* =====================================================
   SAFE RESPONSE JSON
===================================================== */

async function safeResponseJSON(
    response
) {

    try {

        return await response.json();

    }

    catch {

        return {
            error:
                "Server returned an invalid response."
        };

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* =====================================================
   WAIT
===================================================== */

function wait(
    milliseconds
) {

    return new Promise(
        function(resolve) {

            setTimeout(
                resolve,
                milliseconds
            );

        }
    );

}
